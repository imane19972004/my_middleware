		@keyframes slideIn {

</head>
<body>
	<div class="container">
		<div class="sidebar">
			<h1>🚴 Let's Go Biking</h1>

			<div class="info-text">
				💡 <strong>Astuce:</strong> Vous pouvez taper une adresse complète ou juste un nom de ville.
				L'autocomplétion est là pour vous aider mais n'est pas obligatoire !
			</div>

			<div class="input-group">
				<label for="origin">📍 Adresse de départ</label>
				<input type="text" id="origin" placeholder="Ex: Place Bellecour, Lyon ou juste Lyon">
				<div id="origin-results" class="autocomplete-results"></div>
			</div>

			<div class="input-group">
				<label for="destination">🎯 Adresse d'arrivée</label>
				<input type="text" id="destination" placeholder="Ex: Aéroport Nice ou Nice">
				<div id="destination-results" class="autocomplete-results"></div>
			</div>

			<div class="input-group">
				<label for="minBikes">🚲 Vélos minimum</label>
				<input type="number" id="minBikes" value="1" min="1">
			</div>

			<button class="btn" id="searchBtn">Rechercher un itinéraire</button>

			<div id="status"></div>
			<div id="itinerarySteps" class="itinerary-steps" style="display:none;"></div>

			<div class="notifications-section">
				<h2>🔔 Notifications en temps réel</h2>
				<button class="btn" id="subscribeBtn">Activer les notifications</button>
				<div id="notifications" class="notifications-container"></div>
			</div>
		</div>

		<div class="map-container">
			<div id="map"></div>
		</div>
	</div>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

	<script>
		const CONFIG = {
			routingServiceUrl: 'http://localhost:8004/api/itinerary',
			autocompleteUrl: 'http://localhost:8004/api/autocomplete',
			stompBrokerUrl: 'ws://localhost:61614/stomp'
		};

		let map = L.map('map').setView([45.7640, 4.8357], 13);
		L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
			attribution: '© OpenStreetMap contributors'
		}).addTo(map);

		let routeLayer = null;
		let stompClient = null;
		let autocompleteTimeout = null;

		// ===== AUTOCOMPLÉTION (OPTIONNELLE - AIDE UNIQUEMENT) =====
		function setupAutocomplete(inputId, resultsId) {
			const input = document.getElementById(inputId);
			const results = document.getElementById(resultsId);

			input.addEventListener('input', function () {
				const query = this.value.trim();

				// Autocomplétion uniquement si 3+ caractères
				if (query.length < 3) {
					results.classList.remove('show');
					return;
				}

				// Debounce pour éviter trop de requêtes
				clearTimeout(autocompleteTimeout);
				autocompleteTimeout = setTimeout(async () => {
					await fetchSuggestions(query, results, input);
				}, 500); // 500ms de délai
			});

			// Fermer les résultats quand on clique ailleurs
			document.addEventListener('click', function (e) {
				if (!input.contains(e.target) && !results.contains(e.target)) {
					results.classList.remove('show');
				}
			});

			// Permettre de fermer avec Escape
			input.addEventListener('keydown', function (e) {
				if (e.key === 'Escape') {
					results.classList.remove('show');
				}
			});
		}

		async function fetchSuggestions(query, resultsContainer, inputElement) {
			try {
				resultsContainer.innerHTML = '<div class="loading-spinner">🔍 Suggestions...</div>';
				resultsContainer.classList.add('show');

				const response = await fetch(`${CONFIG.autocompleteUrl}?q=${encodeURIComponent(query)}`, {
					signal: AbortSignal.timeout(3000) // Timeout 3s
				});

				if (!response.ok) throw new Error('Erreur API');

				const suggestions = await response.json();

				if (suggestions.length === 0) {
					resultsContainer.innerHTML = '<div class="loading-spinner">💡 Aucune suggestion - tapez quand même votre adresse !</div>';
					setTimeout(() => resultsContainer.classList.remove('show'), 2000);
					return;
				}

				resultsContainer.innerHTML = '';
				suggestions.forEach(suggestion => {
					const item = document.createElement('div');
					item.className = 'autocomplete-item';
					item.textContent = suggestion.label;
					item.addEventListener('click', function () {
						inputElement.value = suggestion.label;
						resultsContainer.classList.remove('show');
					});
					resultsContainer.appendChild(item);
				});
			} catch (error) {
				console.warn('Autocomplétion échouée (non bloquant):', error);
				resultsContainer.innerHTML = '<div class="loading-spinner">💡 Continuez à taper votre adresse</div>';
				setTimeout(() => resultsContainer.classList.remove('show'), 2000);
			}
		}

		// Initialiser l'autocomplétion pour les deux champs
		setupAutocomplete('origin', 'origin-results');
		setupAutocomplete('destination', 'destination-results');

		// ===== NOTIFICATIONS =====
		function connectToActiveMQ() {
			const ws = new WebSocket(CONFIG.stompBrokerUrl);
			stompClient = Stomp.over(ws);

			stompClient.connect('admin', 'admin',
				function onConnect() {
					console.log('✅ Connecté à ActiveMQ');
					showStatus('🔔 Notifications activées', 'success');

					stompClient.subscribe('/topic/weather.alerts', function (message) {
						const data = JSON.parse(message.body);
						displayNotification({
							icon: '☀️',
							message: data.message || 'Météo mise à jour',
							level: data.severity || 'green',
							timestamp: new Date().toLocaleTimeString()
						});
					});

					stompClient.subscribe('/topic/pollution.alerts', function (message) {
						const data = JSON.parse(message.body);
						displayNotification({
							icon: '🌿',
							message: data.message || 'Qualité de l\'air',
							level: data.severity || 'green',
							timestamp: new Date().toLocaleTimeString()
						});
					});

					stompClient.subscribe('/topic/event.alerts', function (message) {
						const data = JSON.parse(message.body);
						displayNotification({
							icon: '🎉',
							message: data.message || 'Événement',
							level: data.severity || 'orange',
							timestamp: new Date().toLocaleTimeString()
						});
					});

					displayNotification({
						icon: '🔔',
						message: 'Notifications en temps réel activées',
						level: 'green',
						timestamp: new Date().toLocaleTimeString()
					});
				},
				function onError(error) {
					console.error('❌ Erreur ActiveMQ:', error);
					showStatus('⚠️ ActiveMQ non disponible', 'error');
					simulateNotifications();
				}
			);
		}

		document.getElementById('subscribeBtn').addEventListener('click', function () {
			this.disabled = true;
			connectToActiveMQ();
		});

		function simulateNotifications() {
			const notifications = [
				{ icon: '☀️', message: 'Météo favorable', level: 'green' },
				{ icon: '✅', message: 'Air excellent', level: 'green' },
				{ icon: '⚠️', message: 'Pollution modérée', level: 'orange' }
			];

			setInterval(() => {
				const notif = notifications[Math.floor(Math.random() * notifications.length)];
				notif.timestamp = new Date().toLocaleTimeString();
				displayNotification(notif);
			}, 20000);
		}

		function displayNotification(notification) {
			const container = document.getElementById('notifications');
			const div = document.createElement('div');
			div.className = `notification ${notification.level}`;
			div.innerHTML = `
					<div class="notification-icon">${notification.icon}</div>
					<div class="notification-content">
						<div class="notification-message">${notification.message}</div>
						<div class="notification-time">${notification.timestamp}</div>
					</div>
				`;
			container.insertBefore(div, container.firstChild);
			while (container.children.length > 10) {
				container.removeChild(container.lastChild);
			}
		}

		// ===== RECHERCHE D'ITINÉRAIRE =====
		document.getElementById('searchBtn').addEventListener('click', async function () {
			const origin = document.getElementById('origin').value.trim();
			const destination = document.getElementById('destination').value.trim();
			const minBikes = parseInt(document.getElementById('minBikes').value);

			if (!origin || !destination) {
				showStatus('⚠️ Veuillez renseigner une adresse de départ et d\'arrivée', 'error');
				return;
			}

			showStatus('🔍 Calcul de l\'itinéraire en cours...', 'info');
			this.disabled = true;

			try {
				const itinerary = await callRoutingServiceREST(origin, destination, minBikes);

				if (itinerary.Instructions && itinerary.Instructions.includes('✅')) {
					showStatus(itinerary.Instructions, 'success');
					displayItinerarySteps(itinerary.Steps);
					drawRouteOnMap(itinerary);
				} else {
					showStatus(itinerary.Instructions || '❌ Erreur', 'error');
				}
			} catch (error) {
				showStatus('❌ Erreur: ' + error.message, 'error');
				console.error(error);
			} finally {
				this.disabled = false;
			}
		});

		async function callRoutingServiceREST(origin, destination, minBikes) {
			const response = await fetch(CONFIG.routingServiceUrl, {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({
					Origin: origin,
					Destination: destination,
					MinBikes: minBikes
				})
			});

			if (!response.ok) {
				throw new Error(`Erreur HTTP ${response.status}`);
			}

			return await response.json();
		}

		function displayItinerarySteps(steps) {
			const container = document.getElementById('itinerarySteps');
			container.innerHTML = '<strong>🗺️ Étapes:</strong>';

			if (!steps || steps.length === 0) {
				container.innerHTML += '<div class="step-item">Aucune étape</div>';
			} else {
				steps.forEach((step, i) => {
					const div = document.createElement('div');
					div.className = 'step-item';
					const icon = step.Type === 'walk' ? '🚶' : '🚴';
					div.innerHTML = `${i + 1}. ${icon} ${step.Instruction} <em>(${(step.Distance / 1000).toFixed(2)} km)</em>`;
					container.appendChild(div);
				});
			}

			container.style.display = 'block';
		}

		function drawRouteOnMap(itinerary) {
			if (routeLayer) {
				map.removeLayer(routeLayer);
			}

			routeLayer = L.layerGroup();

			try {
				if (!itinerary.Steps || itinerary.Steps.length === 0) {
					return;
				}

				const allPositions = [];

				// Dessiner les segments avec les waypoints (vraies routes)
				itinerary.Steps.forEach((step) => {
					if (!step.Waypoints || step.Waypoints.length === 0 || step.Distance === 0) return;

					// Convertir les waypoints en format Leaflet
					const waypointCoords = step.Waypoints.map(wp => [wp.lat, wp.lng]);
					allPositions.push(...waypointCoords);

					// Couleur et style selon le type
					let color, weight, dashArray;
					if (step.Type === 'walk') {
						color = '#28a745'; // Vert pour marche
						weight = 5;
						dashArray = '10, 8'; // Pointillés
					} else {
						color = '#667eea'; // Bleu pour vélo
						weight = 6;
						dashArray = null; // Ligne continue
					}

					// Dessiner la polyligne avec les vrais waypoints
					const polyline = L.polyline(waypointCoords, {
						color: color,
						weight: weight,
						opacity: 0.8,
						dashArray: dashArray,
						lineJoin: 'round',
						lineCap: 'round'
					});

					polyline.bindPopup(`
							<strong>${step.Type === 'walk' ? '🚶 À pied' : '🚴 À vélo'}</strong><br>
							${step.Instruction}<br>
							<em>Distance: ${(step.Distance / 1000).toFixed(2)} km</em><br>
							<em>Durée: ${(step.Duration / 60).toFixed(0)} min</em>
						`);

					routeLayer.addLayer(polyline);
				});

				if (allPositions.length === 0) return;

				// Marqueur de départ
				const firstStep = itinerary.Steps[0];
				if (firstStep.Waypoints && firstStep.Waypoints.length > 0) {
					const startPos = firstStep.Waypoints[0];
					const marker = L.marker([startPos.lat, startPos.lng], {
						icon: L.divIcon({
							className: 'custom-marker',
							html: '<div style="background: #dc3545; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">📍</div>',
							iconSize: [45, 45],
							iconAnchor: [22.5, 22.5]
						})
					});
					marker.bindPopup('<strong>🏁 Départ</strong>');
					routeLayer.addLayer(marker);
				}

				// Marqueur d'arrivée
				const lastStep = itinerary.Steps[itinerary.Steps.length - 1];
				if (lastStep.Waypoints && lastStep.Waypoints.length > 0) {
					const endPos = lastStep.Waypoints[lastStep.Waypoints.length - 1];
					const marker = L.marker([endPos.lat, endPos.lng], {
						icon: L.divIcon({
							className: 'custom-marker',
							html: '<div style="background: #28a745; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">🎯</div>',
							iconSize: [45, 45],
							iconAnchor: [22.5, 22.5]
						})
					});
					marker.bindPopup('<strong>🏁 Arrivée</strong>');
					routeLayer.addLayer(marker);
				}

				// Marqueurs des stations vélo
				itinerary.Steps.forEach((step, index) => {
					if (!step.Waypoints || step.Waypoints.length === 0) return;

					if (step.Instruction.includes('Prendre un vélo')) {
						const pos = step.Waypoints[0];
						const marker = L.marker([pos.lat, pos.lng], {
							icon: L.divIcon({
								className: 'custom-marker',
								html: '<div style="background: #667eea; color: white; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 3px solid white; box-shadow: 0 3px 8px rgba(0,0,0,0.4);">🚲</div>',
								iconSize: [38, 38],
								iconAnchor: [19, 19]
							})
						});
						marker.bindPopup(`<strong>🚲 Station départ</strong><br>${step.Instruction}`);
						routeLayer.addLayer(marker);
					}

					if (step.Instruction.includes('Déposer le vélo')) {
						const pos = step.Waypoints[0];
						const marker = L.marker([pos.lat, pos.lng], {
							icon: L.divIcon({
								className: 'custom-marker',
								html: '<div style="background: #ffc107; color: white; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 3px solid white; box-shadow: 0 3px 8px rgba(0,0,0,0.4);">🅿️</div>',
								iconSize: [38, 38],
								iconAnchor: [19, 19]
							})
						});
						marker.bindPopup(`<strong>🅿️ Station arrivée</strong><br>${step.Instruction}`);
						routeLayer.addLayer(marker);
					}
				});

				routeLayer.addTo(map);

				const bounds = L.latLngBounds(allPositions);
				map.fitBounds(bounds, {
					padding: [60, 60],
					animate: true,
					duration: 1
				});

				showStatus('✅ Itinéraire réel affiché sur la carte !', 'success');

			} catch (error) {
				console.error('❌ Erreur carte:', error);
				showStatus('⚠️ Itinéraire calculé (erreur affichage)', 'info');
			}
		}

		function showStatus(message, type) {
			const statusDiv = document.getElementById('status');
			statusDiv.className = `status ${type}`;
			statusDiv.textContent = message;
		}

		console.log('✅ Let\'s Go Biking chargé avec autocomplétion d\'adresses');
	</script>
</body>

<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Let's Go Biking - Planificateur d'itinéraires</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			padding: 20px;
		}

		.container {
			max-width: 1400px;
			margin: 0 auto;
			display: grid;
			grid-template-columns: 350px 1fr;
			gap: 20px;
			height: calc(100vh - 40px);
		}

		.sidebar {
			background: white;
			border-radius: 15px;
			padding: 25px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.2);
			overflow-y: auto;
		}

		.map-container {
			background: white;
			border-radius: 15px;
			overflow: hidden;
			box-shadow: 0 10px 30px rgba(0,0,0,0.2);
		}

		h1 {
			color: #667eea;
			margin-bottom: 20px;
			font-size: 24px;
		}

		.info-text {
			background: #e8f4f8;
			padding: 10px;
			border-radius: 8px;
			font-size: 12px;
			color: #0c5460;
			margin-bottom: 15px;
		}

		.input-group {
			margin-bottom: 15px;
			position: relative;
		}

		label {
			display: block;
			margin-bottom: 5px;
			color: #333;
			font-weight: 600;
			font-size: 14px;
		}

		input[type="text"], input[type="number"] {
			width: 100%;
			padding: 12px;
			border: 2px solid #e0e0e0;
			border-radius: 8px;
			font-size: 14px;
			transition: border-color 0.3s;
		}

			input[type="text"]:focus, input[type="number"]:focus {
				outline: none;
				border-color: #667eea;
			}

		.autocomplete-results {
			position: absolute;
			top: 100%;
			left: 0;
			right: 0;
			background: white;
			border: 2px solid #667eea;
			border-top: none;
			border-radius: 0 0 8px 8px;
			max-height: 200px;
			overflow-y: auto;
			z-index: 1000;
			display: none;
			box-shadow: 0 4px 6px rgba(0,0,0,0.1);
		}

			.autocomplete-results.show {
				display: block;
			}

		.autocomplete-item {
			padding: 10px 12px;
			cursor: pointer;
			border-bottom: 1px solid #f0f0f0;
			font-size: 13px;
			transition: background 0.2s;
		}

			.autocomplete-item:hover {
				background: #f8f9ff;
			}

			.autocomplete-item:last-child {
				border-bottom: none;
			}

		.loading-spinner {
			padding: 10px;
			text-align: center;
			color: #667eea;
			font-size: 12px;
		}

		.btn {
			width: 100%;
			padding: 14px;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
			border: none;
			border-radius: 8px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: transform 0.2s, box-shadow 0.2s;
			margin-top: 10px;
		}

			.btn:hover {
				transform: translateY(-2px);
				box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
			}

			.btn:disabled {
				background: #ccc;
				cursor: not-allowed;
				transform: none;
			}

		.notifications-section {
			margin-top: 30px;
			padding-top: 20px;
			border-top: 2px solid #f0f0f0;
		}

			.notifications-section h2 {
				font-size: 18px;
				color: #333;
				margin-bottom: 15px;
			}

		.notifications-container {
			max-height: 300px;
			overflow-y: auto;
			margin-top: 15px;
		}

		.notification {
			padding: 12px;
			margin-bottom: 10px;
			border-radius: 8px;
			animation: slideIn 0.3s ease;
			display: flex;
			align-items: center;
			gap: 10px;
		}

			.notification.green {
				background: #d4edda;
				border-left: 4px solid #28a745;
			}

			.notification.orange {
				background: #fff3cd;
				border-left: 4px solid #ffc107;
			}

			.notification.red {
				background: #f8d7da;
				border-left: 4px solid #dc3545;
			}

		.notification-icon {
			font-size: 24px;
		}

		.notification-content {
			flex: 1;
		}

		.notification-message {
			font-size: 14px;
			color: #333;
			margin-bottom: 3px;
		}

		.notification-time {
			font-size: 11px;
			color: #666;
		}

		@keyframes slideIn {
			from {
				opacity: 0;
				transform: translateX(-20px);
			}

			to {
				opacity: 1;
				transform: translateX(0);
			}
		}

		#map {
			width: 100%;
			height: 100%;
		}

		.status {
			padding: 10px;
			margin-top: 10px;
			border-radius: 8px;
			font-size: 13px;
		}

			.status.success {
				background: #d4edda;
				color: #155724;
			}

			.status.error {
				background: #f8d7da;
				color: #721c24;
			}

			.status.info {
				background: #d1ecf1;
				color: #0c5460;
			}

		.itinerary-steps {
			margin-top: 15px;
			padding: 10px;
			background: #f8f9fa;
			border-radius: 8px;
			max-height: 200px;
			overflow-y: auto;
		}

		.step-item {
			padding: 8px;
			margin-bottom: 5px;
			background: white;
			border-radius: 4px;
			font-size: 13px;
		}

		::-webkit-scrollbar {
			width: 8px;
		}

		::-webkit-scrollbar-track {
			background: #f1f1f1;
			border-radius: 10px;
		}

		::-webkit-scrollbar-thumb {
			background: #667eea;
			border-radius: 10px;
		}

			::-webkit-scrollbar-thumb:hover {
				background: #764ba2;
			}

		.custom-marker {
			background: none;
			border: none;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="sidebar">
			<h1>🚴 Let's Go Biking</h1>

			<div class="info-text">
				💡 <strong>Astuce:</strong> Vous pouvez taper une adresse complète ou juste un nom de ville.
				L'autocomplétion est là pour vous aider mais n'est pas obligatoire !
			</div>

			<div class="input-group">
				<label for="origin">📍 Adresse de départ</label>
				<input type="text" id="origin" placeholder="Ex: Polytech Nice Sophia">
				<div id="origin-results" class="autocomplete-results"></div>
			</div>

			<div class="input-group">
				<label for="destination">🎯 Adresse d'arrivée</label>
				<input type="text" id="destination" placeholder="Ex: Aeroport Nice">
				<div id="destination-results" class="autocomplete-results"></div>
			</div>

			<div class="input-group">
				<label for="minBikes">🚲 Vélos minimum</label>
				<input type="number" id="minBikes" value="1" min="1">
			</div>

			<button class="btn" id="searchBtn">Rechercher un itinéraire</button>

			<div id="status"></div>
			<div id="itinerarySteps" class="itinerary-steps" style="display:none;"></div>

			<div class="notifications-section">
				<h2>🔔 Notifications en temps réel</h2>
				<button class="btn" id="subscribeBtn">Activer les notifications</button>
				<div id="notifications" class="notifications-container"></div>
			</div>
		</div>

		<div class="map-container">
			<div id="map"></div>
		</div>
	</div>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

	<script>
		const CONFIG = {
			routingServiceUrl: 'http://localhost:8004/api/itinerary',
			autocompleteUrl: 'http://localhost:8004/api/autocomplete',
			stompBrokerUrl: 'ws://localhost:61614/stomp'
		};

		let map = L.map('map').setView([43.6155, 7.0719], 12);
		L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
			attribution: '© OpenStreetMap contributors'
		}).addTo(map);

		let routeLayer = null;
		let stompClient = null;
		let autocompleteTimeout = null;

		// ===== AUTOCOMPLÉTION =====
		function setupAutocomplete(inputId, resultsId) {
			const input = document.getElementById(inputId);
			const results = document.getElementById(resultsId);

			input.addEventListener('input', function () {
				const query = this.value.trim();
				if (query.length < 3) {
					results.classList.remove('show');
					return;
				}

				clearTimeout(autocompleteTimeout);
				autocompleteTimeout = setTimeout(async () => {
					await fetchSuggestions(query, results, input);
				}, 500);
			});

			document.addEventListener('click', function (e) {
				if (!input.contains(e.target) && !results.contains(e.target)) {
					results.classList.remove('show');
				}
			});

			input.addEventListener('keydown', function (e) {
				if (e.key === 'Escape') {
					results.classList.remove('show');
				}
			});
		}

		async function fetchSuggestions(query, resultsContainer, inputElement) {
			try {
				resultsContainer.innerHTML = '<div class="loading-spinner">🔍 Suggestions...</div>';
				resultsContainer.classList.add('show');

				const response = await fetch(`${CONFIG.autocompleteUrl}?q=${encodeURIComponent(query)}`, {
					signal: AbortSignal.timeout(3000)
				});

				if (!response.ok) throw new Error('Erreur API');

				const suggestions = await response.json();

				if (suggestions.length === 0) {
					resultsContainer.innerHTML = '<div class="loading-spinner">💡 Aucune suggestion - tapez quand même votre adresse !</div>';
					setTimeout(() => resultsContainer.classList.remove('show'), 2000);
					return;
				}

				resultsContainer.innerHTML = '';
				suggestions.forEach(suggestion => {
					const item = document.createElement('div');
					item.className = 'autocomplete-item';
					item.textContent = suggestion.label;
					item.addEventListener('click', function () {
						inputElement.value = suggestion.label;
						resultsContainer.classList.remove('show');
					});
					resultsContainer.appendChild(item);
				});
			} catch (error) {
				console.warn('Autocomplétion échouée (non bloquant):', error);
				resultsContainer.innerHTML = '<div class="loading-spinner">💡 Continuez à taper votre adresse</div>';
				setTimeout(() => resultsContainer.classList.remove('show'), 2000);
			}
		}

		setupAutocomplete('origin', 'origin-results');
		setupAutocomplete('destination', 'destination-results');

		// ===== NOTIFICATIONS =====
		function connectToActiveMQ() {
			const ws = new WebSocket(CONFIG.stompBrokerUrl);
			stompClient = Stomp.over(ws);

			stompClient.connect('admin', 'admin',
				function onConnect() {
					console.log('✅ Connecté à ActiveMQ');
					showStatus('🔔 Notifications activées', 'success');

					stompClient.subscribe('/topic/weather.alerts', function (message) {
						const data = JSON.parse(message.body);
						displayNotification({
							icon: '☀️',
							message: data.message || 'Météo mise à jour',
							level: data.severity || 'green',
							timestamp: new Date().toLocaleTimeString()
						});
					});

					stompClient.subscribe('/topic/pollution.alerts', function (message) {
						const data = JSON.parse(message.body);
						displayNotification({
							icon: '🌿',
							message: data.message || 'Qualité de l\'air',
							level: data.severity || 'green',
							timestamp: new Date().toLocaleTimeString()
						});
					});

					stompClient.subscribe('/topic/event.alerts', function (message) {
						const data = JSON.parse(message.body);
						displayNotification({
							icon: '🎉',
							message: data.message || 'Événement',
							level: data.severity || 'orange',
							timestamp: new Date().toLocaleTimeString()
						});
					});

					displayNotification({
						icon: '🔔',
						message: 'Notifications en temps réel activées',
						level: 'green',
						timestamp: new Date().toLocaleTimeString()
					});
				},
				function onError(error) {
					console.error('❌ Erreur ActiveMQ:', error);
					showStatus('⚠️ ActiveMQ non disponible', 'error');
					simulateNotifications();
				}
			);
		}

		document.getElementById('subscribeBtn').addEventListener('click', function () {
			this.disabled = true;
			connectToActiveMQ();
		});

		function simulateNotifications() {
			const notifications = [
				{ icon: '☀️', message: 'Météo favorable', level: 'green' },
				{ icon: '✅', message: 'Air excellent', level: 'green' },
				{ icon: '⚠️', message: 'Pollution modérée', level: 'orange' }
			];

			setInterval(() => {
				const notif = notifications[Math.floor(Math.random() * notifications.length)];
				notif.timestamp = new Date().toLocaleTimeString();
				displayNotification(notif);
			}, 20000);
		}

		function displayNotification(notification) {
			const container = document.getElementById('notifications');
			const div = document.createElement('div');
			div.className = `notification ${notification.level}`;
			div.innerHTML = `
					<div class="notification-icon">${notification.icon}</div>
					<div class="notification-content">
						<div class="notification-message">${notification.message}</div>
						<div class="notification-time">${notification.timestamp}</div>
					</div>
				`;
			container.insertBefore(div, container.firstChild);
			while (container.children.length > 10) {
				container.removeChild(container.lastChild);
			}
		}

		// ===== RECHERCHE D'ITINÉRAIRE =====
		document.getElementById('searchBtn').addEventListener('click', async function () {
			const origin = document.getElementById('origin').value.trim();
			const destination = document.getElementById('destination').value.trim();
			const minBikes = parseInt(document.getElementById('minBikes').value);

			if (!origin || !destination) {
				showStatus('⚠️ Veuillez renseigner une adresse de départ et d\'arrivée', 'error');
				return;
			}

			showStatus('🔍 Calcul de l\'itinéraire en cours...', 'info');
			this.disabled = true;

			try {
				const itinerary = await callRoutingServiceREST(origin, destination, minBikes);

				if (itinerary.Instructions && itinerary.Instructions.includes('✅')) {
					showStatus(itinerary.Instructions, 'success');
					displayItinerarySteps(itinerary.Steps);
					drawRouteOnMap(itinerary);
				} else {
					showStatus(itinerary.Instructions || '❌ Erreur', 'error');
				}
			} catch (error) {
				showStatus('❌ Erreur: ' + error.message, 'error');
				console.error(error);
			} finally {
				this.disabled = false;
			}
		});

		async function callRoutingServiceREST(origin, destination, minBikes) {
			const response = await fetch(CONFIG.routingServiceUrl, {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({
					Origin: origin,
					Destination: destination,
					MinBikes: minBikes
				})
			});

			if (!response.ok) {
				throw new Error(`Erreur HTTP ${response.status}`);
			}

			return await response.json();
		}

		function displayItinerarySteps(steps) {
			const container = document.getElementById('itinerarySteps');
			container.innerHTML = '<strong>🗺️ Étapes:</strong>';

			if (!steps || steps.length === 0) {
				container.innerHTML += '<div class="step-item">Aucune étape</div>';
			} else {
				steps.forEach((step, i) => {
					const div = document.createElement('div');
					div.className = 'step-item';
					const icon = step.Type === 'walk' ? '🚶' : '🚴';
					div.innerHTML = `${i + 1}. ${icon} ${step.Instruction} <em>(${(step.Distance / 1000).toFixed(2)} km)</em>`;
					container.appendChild(div);
				});
			}

			container.style.display = 'block';
		}

		function drawRouteOnMap(itinerary) {
			if (routeLayer) {
				map.removeLayer(routeLayer);
			}

			routeLayer = L.layerGroup();

			try {
				if (!itinerary.Steps || itinerary.Steps.length === 0) {
					console.warn('⚠️ Aucune étape à afficher');
					return;
				}

				const allPositions = [];

				console.log('🗺️ DÉBUT TRACÉ - Steps reçues:', itinerary.Steps.length);

				// Dessiner les segments avec les waypoints
				itinerary.Steps.forEach((step, index) => {
					// Vérifier si on a des waypoints valides
					if (!step.Waypoints || step.Waypoints.length === 0) {
						console.warn(`⚠️ Step ${index} sans waypoints:`, step.Instruction);
						return;
					}

					// Ignorer les étapes "prendre/déposer vélo" (distance = 0)
					if (step.Distance === 0) {
						console.log(`⏭️ Step ${index} ignorée (action):`, step.Instruction);
						return;
					}

					// Convertir et valider les waypoints
					const waypointCoords = step.Waypoints
						.filter(wp => wp && typeof wp.lat === 'number' && typeof wp.lng === 'number')
						.map(wp => [wp.lat, wp.lng]);

					if (waypointCoords.length < 2) {
						console.warn(`⚠️ Pas assez de waypoints valides pour step ${index} (${waypointCoords.length})`);
						return;
					}

					allPositions.push(...waypointCoords);

					// Style selon le type
					let color, weight, dashArray, opacity;
					if (step.Type === 'walk') {
						color = '#28a745';
						weight = 5;
						dashArray = '10, 8';
						opacity = 0.85;
					} else {
						color = '#667eea';
						weight = 7;
						dashArray = null;
						opacity = 0.9;
					}

					console.log(`✅ Step ${index} (${step.Type}): ${waypointCoords.length} waypoints tracés`);

					// Dessiner la polyligne
					const polyline = L.polyline(waypointCoords, {
						color: color,
						weight: weight,
						opacity: opacity,
						dashArray: dashArray,
						lineJoin: 'round',
						lineCap: 'round',
						smoothFactor: 1.0
					});

					polyline.bindPopup(`
							<strong>${step.Type === 'walk' ? '🚶 À pied' : '🚴 À vélo'}</strong><br>
							${step.Instruction}<br>
							<em>Distance: ${(step.Distance / 1000).toFixed(2)} km</em><br>
							<em>Durée: ${(step.Duration / 60).toFixed(0)} min</em><br>
							<small style="color: #666;">${waypointCoords.length} points de route</small>
						`);

					routeLayer.addLayer(polyline);
				});

				if (allPositions.length === 0) {
					console.error('❌ Aucune position à afficher !');
					showStatus('⚠️ Erreur: aucune route à afficher', 'error');
					return;
				}

				console.log(`📊 TOTAL: ${allPositions.length} points de route tracés`);

				// Marqueur de départ
				const firstStep = itinerary.Steps[0];
				if (firstStep.Waypoints && firstStep.Waypoints.length > 0) {
					const startPos = firstStep.Waypoints[0];
					const marker = L.marker([startPos.lat, startPos.lng], {
						icon: L.divIcon({
							className: 'custom-marker',
							html: '<div style="background: #dc3545; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">📍</div>',
							iconSize: [45, 45],
							iconAnchor: [22.5, 22.5]
						})
					});
					marker.bindPopup('<strong>🏁 Départ</strong>');
					routeLayer.addLayer(marker);
				}

				// Marqueur d'arrivée
				const lastStep = itinerary.Steps[itinerary.Steps.length - 1];
				if (lastStep.Waypoints && lastStep.Waypoints.length > 0) {
					const endPos = lastStep.Waypoints[lastStep.Waypoints.length - 1];
					const marker = L.marker([endPos.lat, endPos.lng], {
						icon: L.divIcon({
							className: 'custom-marker',
							html: '<div style="background: #28a745; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">🎯</div>',
							iconSize: [45, 45],
							iconAnchor: [22.5, 22.5]
						})
					});
					marker.bindPopup('<strong>🏁 Arrivée</strong>');
					routeLayer.addLayer(marker);
				}

				// Marqueurs des stations
				itinerary.Steps.forEach((step, index) => {
					if (!step.Waypoints || step.Waypoints.length === 0) return;

					if (step.Instruction.includes('Prendre un vélo')) {
						const pos = step.Waypoints[0];
						const marker = L.marker([pos.lat, pos.lng], {
							icon: L.divIcon({
								className: 'custom-marker',
								html: '<div style="background: #667eea; color: white; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 3px solid white; box-shadow: 0 3px 8px rgba(0,0,0,0.4);">🚲</div>',
								iconSize: [38, 38],
								iconAnchor: [19, 19]
							})
						});
						marker.bindPopup(`<strong>🚲 Station départ</strong><br>${step.Instruction}`);
						routeLayer.addLayer(marker);
					}

					if (step.Instruction.includes('Déposer le vélo')) {
						const pos = step.Waypoints[0];
						const marker = L.marker([pos.lat, pos.lng], {
							icon: L.divIcon({
								className: 'custom-marker',
								html: '<div style="background: #ffc107; color: white; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 3px solid white; box-shadow: 0 3px 8px rgba(0,0,0,0.4);">🅿️</div>',
								iconSize: [38, 38],
								iconAnchor: [19, 19]
							})
						});
						marker.bindPopup(`<strong>🅿️ Station arrivée</strong><br>${step.Instruction}`);
						routeLayer.addLayer(marker);
					}
				});

				routeLayer.addTo(map);

				const bounds = L.latLngBounds(allPositions);
				map.fitBounds(bounds, {
					padding: [60, 60],
					animate: true,
					duration: 1
				});

				console.log('✅ Carte mise à jour avec succès');

			} catch (error) {
				console.error('❌ Erreur affichage carte:', error);
				showStatus('⚠️ Itinéraire calculé mais erreur d\'affichage', 'info');
			}
		}

		function showStatus(message, type) {
			const statusDiv = document.getElementById('status');
			statusDiv.className = `status ${type}`;
			statusDiv.textContent = message;
		}

		console.log('✅ Let\'s Go Biking chargé - Version améliorée avec debug routes');
	</script>
</body>
</html>
