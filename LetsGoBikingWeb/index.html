	<div class="container">

				<input type="text" id="destination" placeholder="Ex: Toulouse" value="Toulouse">
			</div>

			<div class="input-group">
				<label for="minBikes">🚲 Vélos minimum</label>
				<input type="number" id="minBikes" value="1" min="1">
			</div>

			<button class="btn" id="searchBtn">Rechercher un itinéraire</button>

			<div id="status"></div>
			<div id="itinerarySteps" class="itinerary-steps" style="display:none;"></div>

			<div class="notifications-section">
				<h2>🔔 Notifications en temps réel</h2>
				<button class="btn" id="subscribeBtn">Activer les notifications</button>
				<div id="notifications" class="notifications-container"></div>
			</div>
		</div>

		<div class="map-container">
			<div id="map"></div>
		</div>
	</div>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

	<script>
		const CONFIG = {
			routingServiceUrl: 'http://localhost:8004/api/itinerary',
			stompBrokerUrl: 'ws://localhost:61614/stomp'
		};

		// Base de données de villes avec leurs coordonnées
		const CITIES_DATABASE = {
			'Lyon': { lat: 45.7640, lng: 4.8357 },
			'Toulouse': { lat: 43.6047, lng: 1.4442 },
			'Paris': { lat: 48.8566, lng: 2.3522 },
			'Marseille': { lat: 43.2965, lng: 5.3698 },
			'Nice': { lat: 43.7102, lng: 7.2620 },
			'Nantes': { lat: 47.2184, lng: -1.5536 },
			'Strasbourg': { lat: 48.5734, lng: 7.7521 },
			'Montpellier': { lat: 43.6108, lng: 3.8767 },
			'Bordeaux': { lat: 44.8378, lng: -0.5792 },
			'Lille': { lat: 50.6292, lng: 3.0573 }
		};

		let map = L.map('map').setView([46.603354, 1.888334], 6);
		L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
			attribution: '© OpenStreetMap contributors'
		}).addTo(map);

		let routeLayer = null;
		let stompClient = null;
		let isConnectedToStomp = false;

		function connectToActiveMQ() {
			const ws = new WebSocket(CONFIG.stompBrokerUrl);
			stompClient = Stomp.over(ws);

			stompClient.connect('admin', 'admin',
				function onConnect() {
					console.log('✅ Connecté à ActiveMQ');
					isConnectedToStomp = true;
					showStatus('🔔 Notifications activées (ActiveMQ connecté)', 'success');

					stompClient.subscribe('/topic/weather.alerts', function (message) {
						const data = JSON.parse(message.body);
						displayNotification({
							icon: '☀️',
							message: data.message || 'Météo mise à jour',
							level: data.severity || 'green',
							timestamp: new Date().toLocaleTimeString()
						});
					});

					stompClient.subscribe('/topic/pollution.alerts', function (message) {
						const data = JSON.parse(message.body);
						displayNotification({
							icon: '🌿',
							message: data.message || 'Qualité de l\'air mise à jour',
							level: data.severity || 'green',
							timestamp: new Date().toLocaleTimeString()
						});
					});

					stompClient.subscribe('/topic/event.alerts', function (message) {
						const data = JSON.parse(message.body);
						displayNotification({
							icon: '🎉',
							message: data.message || 'Événement détecté',
							level: data.severity || 'orange',
							timestamp: new Date().toLocaleTimeString()
						});
					});

					displayNotification({
						icon: '🔔',
						message: 'Connexion ActiveMQ réussie ! Notifications en temps réel activées.',
						level: 'green',
						timestamp: new Date().toLocaleTimeString()
					});
				},
				function onError(error) {
					console.error('❌ Erreur ActiveMQ:', error);
					isConnectedToStomp = false;
					showStatus('⚠️ ActiveMQ non disponible, mode simulation activé', 'error');
					simulateNotifications();
				}
			);
		}

		document.getElementById('subscribeBtn').addEventListener('click', function () {
			this.disabled = true;
			connectToActiveMQ();
		});

		function simulateNotifications() {
			const notifications = [
				{ icon: '☀️', message: 'Météo favorable pour le vélo', level: 'green' },
				{ icon: '✅', message: 'Qualité de l\'air excellente', level: 'green' },
				{ icon: '⚠️', message: 'Pollution modérée détectée', level: 'orange' },
				{ icon: '🎉', message: 'Événement en centre-ville', level: 'orange' },
				{ icon: '🌧️', message: 'Risque de pluie dans 30min', level: 'orange' }
			];

			setInterval(() => {
				const notif = notifications[Math.floor(Math.random() * notifications.length)];
				notif.timestamp = new Date().toLocaleTimeString();
				displayNotification(notif);
			}, 20000);

			displayNotification({
				icon: '🔔',
				message: 'Système de notifications actif (mode simulation)',
				level: 'green',
				timestamp: new Date().toLocaleTimeString()
			});
		}

		function displayNotification(notification) {
			const container = document.getElementById('notifications');
			const div = document.createElement('div');
			div.className = `notification ${notification.level}`;
			div.innerHTML = `
					<div class="notification-icon">${notification.icon}</div>
					<div class="notification-content">
						<div class="notification-message">${notification.message}</div>
						<div class="notification-time">${notification.timestamp}</div>
					</div>
				`;
			container.insertBefore(div, container.firstChild);
			while (container.children.length > 10) {
				container.removeChild(container.lastChild);
			}
		}

		document.getElementById('searchBtn').addEventListener('click', async function () {
			const origin = document.getElementById('origin').value.trim();
			const destination = document.getElementById('destination').value.trim();
			const minBikes = parseInt(document.getElementById('minBikes').value);

			if (!origin || !destination) {
				showStatus('⚠️ Veuillez renseigner origine et destination', 'error');
				return;
			}

			showStatus('🔍 Calcul de l\'itinéraire en cours...', 'info');
			this.disabled = true;

			try {
				const itinerary = await callRoutingServiceREST(origin, destination, minBikes);

				if (itinerary.Instructions && itinerary.Instructions.includes('✅')) {
					showStatus(itinerary.Instructions, 'success');
					displayItinerarySteps(itinerary.Steps);
					drawRouteOnMap(itinerary, origin, destination);
				} else {
					showStatus(itinerary.Instructions || '❌ Erreur inconnue', 'error');
				}
			} catch (error) {
				showStatus('❌ Erreur: ' + error.message, 'error');
				console.error(error);
			} finally {
				this.disabled = false;
			}
		});

		async function callRoutingServiceREST(origin, destination, minBikes) {
			const response = await fetch(CONFIG.routingServiceUrl, {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({
					Origin: origin,
					Destination: destination,
					MinBikes: minBikes
				})
			});

			if (!response.ok) {
				throw new Error(`Erreur HTTP ${response.status}`);
			}

			return await response.json();
		}

		function displayItinerarySteps(steps) {
			const container = document.getElementById('itinerarySteps');
			container.innerHTML = '<strong>🗺️ Étapes:</strong>';

			if (!steps || steps.length === 0) {
				container.innerHTML += '<div class="step-item">Aucune étape disponible</div>';
			} else {
				steps.forEach((step, i) => {
					const div = document.createElement('div');
					div.className = 'step-item';
					const icon = step.Type === 'walk' ? '🚶' : '🚴';
					div.innerHTML = `${i + 1}. ${icon} ${step.Instruction} <em>(${(step.Distance / 1000).toFixed(2)} km)</em>`;
					container.appendChild(div);
				});
			}

			container.style.display = 'block';
		}

		function drawRouteOnMap(itinerary, origin, destination) {
			// Nettoyer les anciennes couches
			if (routeLayer) {
				map.removeLayer(routeLayer);
			}

			// Créer un nouveau groupe de couches
			routeLayer = L.layerGroup();

			try {
				// Obtenir les coordonnées de l'origine et de la destination
				const originCoords = getCityCoordinates(origin);
				const destCoords = getCityCoordinates(destination);

				if (!originCoords || !destCoords) {
					console.warn('⚠️ Coordonnées non trouvées');
					showStatus('✅ Itinéraire calculé !', 'success');
					return;
				}

				// Créer des positions intermédiaires en fonction des étapes
				const positions = generateRoutePositions(originCoords, destCoords, itinerary.Steps);

				// 1. Dessiner la ligne de l'itinéraire
				const polyline = L.polyline(positions, {
					color: '#667eea',
					weight: 6,
					opacity: 0.8,
					smoothFactor: 1,
					dashArray: '10, 5'
				});
				routeLayer.addLayer(polyline);

				// 2. Ajouter le marqueur de départ
				const startMarker = L.marker([originCoords.lat, originCoords.lng], {
					icon: L.divIcon({
						className: 'custom-marker',
						html: '<div style="background-color: #dc3545; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 3px solid white; box-shadow: 0 3px 8px rgba(0,0,0,0.4);">📍</div>',
						iconSize: [45, 45],
						iconAnchor: [22.5, 22.5]
					})
				});
				startMarker.bindPopup(`<strong>🏁 Départ</strong><br>${origin}`);
				routeLayer.addLayer(startMarker);

				// 3. Ajouter le marqueur d'arrivée
				const endMarker = L.marker([destCoords.lat, destCoords.lng], {
					icon: L.divIcon({
						className: 'custom-marker',
						html: '<div style="background-color: #28a745; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 3px solid white; box-shadow: 0 3px 8px rgba(0,0,0,0.4);">🎯</div>',
						iconSize: [45, 45],
						iconAnchor: [22.5, 22.5]
					})
				});
				endMarker.bindPopup(`<strong>🏁 Arrivée</strong><br>${destination}`);
				routeLayer.addLayer(endMarker);

				// 4. Ajouter des marqueurs pour les stations vélo (si présentes)
				itinerary.Steps.forEach((step, index) => {
					if (step.Instruction.includes('station') && index > 0 && index < positions.length - 1) {
						const pos = positions[Math.floor(positions.length * (index / itinerary.Steps.length))];

						let icon = '🚲';
						let color = '#667eea';

						if (step.Instruction.includes('Prendre')) {
							icon = '🚴';
							color = '#28a745';
						} else if (step.Instruction.includes('Déposer')) {
							icon = '🅿️';
							color = '#ffc107';
						}

						const stationMarker = L.marker(pos, {
							icon: L.divIcon({
								className: 'custom-marker',
								html: `<div style="background-color: ${color}; color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.3);">${icon}</div>`,
								iconSize: [35, 35],
								iconAnchor: [17.5, 17.5]
							})
						});

						stationMarker.bindPopup(`
								<strong>${icon} ${step.Type === 'bike' ? 'Station vélo' : 'Étape'}</strong><br>
								${step.Instruction}<br>
								<em>Distance: ${(step.Distance / 1000).toFixed(2)} km</em>
							`);

						routeLayer.addLayer(stationMarker);
					}
				});

				// 5. Ajouter le groupe à la carte
				routeLayer.addTo(map);

				// 6. Centrer la carte sur l'itinéraire avec animation
				map.fitBounds(polyline.getBounds(), {
					padding: [80, 80],
					animate: true,
					duration: 1
				});

				showStatus('✅ Itinéraire affiché sur la carte !', 'success');
			} catch (error) {
				console.error('❌ Erreur lors du dessin sur la carte:', error);
				showStatus('✅ Itinéraire calculé (affichage carte partiel)', 'success');
			}
		}

		// Fonction pour obtenir les coordonnées d'une ville
		function getCityCoordinates(cityName) {
			const normalized = cityName.trim();

			// Recherche exacte
			if (CITIES_DATABASE[normalized]) {
				return CITIES_DATABASE[normalized];
			}

			// Recherche partielle
			for (const [city, coords] of Object.entries(CITIES_DATABASE)) {
				if (normalized.toLowerCase().includes(city.toLowerCase()) ||
					city.toLowerCase().includes(normalized.toLowerCase())) {
					return coords;
				}
			}

			// Par défaut: milieu de la France
			return { lat: 46.603354, lng: 1.888334 };
		}

		// Génère des positions intermédiaires pour l'itinéraire
		function generateRoutePositions(originCoords, destCoords, steps) {
			const positions = [];
			const numIntermediatePoints = Math.max(steps.length, 5);

			for (let i = 0; i <= numIntermediatePoints; i++) {
				const ratio = i / numIntermediatePoints;

				// Ajouter une légère courbure pour un trajet plus réaliste
				const curveFactor = 0.1; // 10% de déviation
				const midpointLat = (originCoords.lat + destCoords.lat) / 2;
				const midpointLng = (originCoords.lng + destCoords.lng) / 2;

				// Calcul de la position avec courbe
				let lat = originCoords.lat + (destCoords.lat - originCoords.lat) * ratio;
				let lng = originCoords.lng + (destCoords.lng - originCoords.lng) * ratio;

				// Ajouter une courbe au milieu du trajet
				if (ratio > 0.2 && ratio < 0.8) {
					const curveAmount = Math.sin(ratio * Math.PI) * curveFactor;
					const perpLat = -(destCoords.lng - originCoords.lng) * curveAmount;
					const perpLng = (destCoords.lat - originCoords.lat) * curveAmount;
					lat += perpLat;
					lng += perpLng;
				}

				positions.push([lat, lng]);
			}

			return positions;
		}

		function showStatus(message, type) {
			const statusDiv = document.getElementById('status');
			statusDiv.className = `status ${type}`;
			statusDiv.textContent = message;
		}

		console.log('✅ JavaScript chargé correctement (version REST avec carte interactive)');
	</script>

			color: white;
			border: none;
			border-radius: 8px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: transform 0.2s, box-shadow 0.2s;
			margin-top: 10px;
		}

			.btn:hover {
				transform: translateY(-2px);
				box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
			}

			.btn:disabled {
				background: #ccc;
				cursor: not-allowed;
				transform: none;
			}

		.notifications-section {
			margin-top: 30px;
			padding-top: 20px;
			border-top: 2px solid #f0f0f0;
		}

			.notifications-section h2 {
				font-size: 18px;
				color: #333;
				margin-bottom: 15px;
			}

		.notifications-container {
			max-height: 300px;
			overflow-y: auto;
			margin-top: 15px;
		}

		.notification {
			padding: 12px;
			margin-bottom: 10px;
			border-radius: 8px;
			animation: slideIn 0.3s ease;
			display: flex;
			align-items: center;
			gap: 10px;
		}

			.notification.green {
				background: #d4edda;
				border-left: 4px solid #28a745;
			}

			.notification.orange {
				background: #fff3cd;
				border-left: 4px solid #ffc107;
			}

			.notification.red {
				background: #f8d7da;
				border-left: 4px solid #dc3545;
			}

		.notification-icon {
			font-size: 24px;
		}

		.notification-content {
			flex: 1;
		}

		.notification-message {
			font-size: 14px;
			color: #333;
			margin-bottom: 3px;
		}

		.notification-time {
			font-size: 11px;
			color: #666;
		}

		@keyframes slideIn {
			from {
				opacity: 0;
				transform: translateX(-20px);
			}

			to {
				opacity: 1;
				transform: translateX(0);
			}
		}

		#map {
			width: 100%;
			height: 100%;
		}

		.status {
			padding: 10px;
			margin-top: 10px;
			border-radius: 8px;
			font-size: 13px;
		}

			.status.success {
				background: #d4edda;
				color: #155724;
			}

			.status.error {
				background: #f8d7da;
				color: #721c24;
			}

			.status.info {
				background: #d1ecf1;
				color: #0c5460;
			}

		.itinerary-steps {
			margin-top: 15px;
			padding: 10px;
			background: #f8f9fa;
			border-radius: 8px;
			max-height: 200px;
			overflow-y: auto;
		}

		.step-item {
			padding: 8px;
			margin-bottom: 5px;
			background: white;
			border-radius: 4px;
			font-size: 13px;
		}

		::-webkit-scrollbar {
			width: 8px;
		}

		::-webkit-scrollbar-track {
			background: #f1f1f1;
			border-radius: 10px;
		}

		::-webkit-scrollbar-thumb {
			background: #667eea;
			border-radius: 10px;
		}

			::-webkit-scrollbar-thumb:hover {
				background: #764ba2;
			}

		.custom-marker {
			background: none;
			border: none;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="sidebar">
			<h1>🚴 Let's Go Biking</h1>

			<div class="input-group">
				<label for="origin">📍 Origine</label>
				<input type="text" id="origin" placeholder="Ex: Lyon" value="Lyon">
			</div>

			<div class="input-group">
				<label for="destination">🎯 Destination</label>
				<input type="text" id="destination" placeholder="Ex: Toulouse" value="Toulouse">
			</div>

			<div class="input-group">
				<label for="minBikes">🚲 Vélos minimum</label>
				<input type="number" id="minBikes" value="1" min="1">
			</div>

			<button class="btn" id="searchBtn">Rechercher un itinéraire</button>

			<div id="status"></div>
			<div id="itinerarySteps" class="itinerary-steps" style="display:none;"></div>

			<div class="notifications-section">
				<h2>🔔 Notifications en temps réel</h2>
				<button class="btn" id="subscribeBtn">Activer les notifications</button>
				<div id="notifications" class="notifications-container"></div>
			</div>
		</div>

		<div class="map-container">
			<div id="map"></div>
		</div>
	</div>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

	<script>
		const CONFIG = {
			routingServiceUrl: 'http://localhost:8004/api/itinerary',
			stompBrokerUrl: 'ws://localhost:61614/stomp'
		};

		let map = L.map('map').setView([46.603354, 1.888334], 6);
		L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
			attribution: '© OpenStreetMap contributors'
		}).addTo(map);

		let routeLayer = null;
		let stompClient = null;
		let isConnectedToStomp = false;

		function connectToActiveMQ() {
			const ws = new WebSocket(CONFIG.stompBrokerUrl);
			stompClient = Stomp.over(ws);

			stompClient.connect('admin', 'admin',
				function onConnect() {
					console.log('✅ Connecté à ActiveMQ');
					isConnectedToStomp = true;
					showStatus('🔔 Notifications activées (ActiveMQ connecté)', 'success');

					stompClient.subscribe('/topic/weather.alerts', function (message) {
						const data = JSON.parse(message.body);
						displayNotification({
							icon: '☀️',
							message: data.message || 'Météo mise à jour',
							level: data.severity || 'green',
							timestamp: new Date().toLocaleTimeString()
						});
					});

					stompClient.subscribe('/topic/pollution.alerts', function (message) {
						const data = JSON.parse(message.body);
						displayNotification({
							icon: '🌿',
							message: data.message || 'Qualité de l\'air mise à jour',
							level: data.severity || 'green',
							timestamp: new Date().toLocaleTimeString()
						});
					});

					stompClient.subscribe('/topic/event.alerts', function (message) {
						const data = JSON.parse(message.body);
						displayNotification({
							icon: '🎉',
							message: data.message || 'Événement détecté',
							level: data.severity || 'orange',
							timestamp: new Date().toLocaleTimeString()
						});
					});

					displayNotification({
						icon: '🔔',
						message: 'Connexion ActiveMQ réussie ! Notifications en temps réel activées.',
						level: 'green',
						timestamp: new Date().toLocaleTimeString()
					});
				},
				function onError(error) {
					console.error('❌ Erreur ActiveMQ:', error);
					isConnectedToStomp = false;
					showStatus('⚠️ ActiveMQ non disponible, mode simulation activé', 'error');
					simulateNotifications();
				}
			);
		}

		document.getElementById('subscribeBtn').addEventListener('click', function () {
			this.disabled = true;
			connectToActiveMQ();
		});

		function simulateNotifications() {
			const notifications = [
				{ icon: '☀️', message: 'Météo favorable pour le vélo', level: 'green' },
				{ icon: '✅', message: 'Qualité de l\'air excellente', level: 'green' },
				{ icon: '⚠️', message: 'Pollution modérée détectée', level: 'orange' },
				{ icon: '🎉', message: 'Événement en centre-ville', level: 'orange' },
				{ icon: '🌧️', message: 'Risque de pluie dans 30min', level: 'orange' }
			];

			setInterval(() => {
				const notif = notifications[Math.floor(Math.random() * notifications.length)];
				notif.timestamp = new Date().toLocaleTimeString();
				displayNotification(notif);
			}, 20000);

			displayNotification({
				icon: '🔔',
				message: 'Système de notifications actif (mode simulation)',
				level: 'green',
				timestamp: new Date().toLocaleTimeString()
			});
		}

		function displayNotification(notification) {
			const container = document.getElementById('notifications');
			const div = document.createElement('div');
			div.className = `notification ${notification.level}`;
			div.innerHTML = `
					<div class="notification-icon">${notification.icon}</div>
					<div class="notification-content">
						<div class="notification-message">${notification.message}</div>
						<div class="notification-time">${notification.timestamp}</div>
					</div>
				`;
			container.insertBefore(div, container.firstChild);
			while (container.children.length > 10) {
				container.removeChild(container.lastChild);
			}
		}

		document.getElementById('searchBtn').addEventListener('click', async function () {
			const origin = document.getElementById('origin').value.trim();
			const destination = document.getElementById('destination').value.trim();
			const minBikes = parseInt(document.getElementById('minBikes').value);

			if (!origin || !destination) {
				showStatus('⚠️ Veuillez renseigner origine et destination', 'error');
				return;
			}

			showStatus('🔍 Calcul de l\'itinéraire en cours...', 'info');
			this.disabled = true;

			try {
				const itinerary = await callRoutingServiceREST(origin, destination, minBikes);

				if (itinerary.Instructions && itinerary.Instructions.includes('✅')) {
					showStatus(itinerary.Instructions, 'success');
					displayItinerarySteps(itinerary.Steps);
					drawRouteOnMap(itinerary);
				} else {
					showStatus(itinerary.Instructions || '❌ Erreur inconnue', 'error');
				}
			} catch (error) {
				showStatus('❌ Erreur: ' + error.message, 'error');
				console.error(error);
			} finally {
				this.disabled = false;
			}
		});

		async function callRoutingServiceREST(origin, destination, minBikes) {
			const response = await fetch(CONFIG.routingServiceUrl, {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({
					Origin: origin,
					Destination: destination,
					MinBikes: minBikes
				})
			});

			if (!response.ok) {
				throw new Error(`Erreur HTTP ${response.status}`);
			}

			return await response.json();
		}

		function displayItinerarySteps(steps) {
			const container = document.getElementById('itinerarySteps');
			container.innerHTML = '<strong>🗺️ Étapes:</strong>';

			if (!steps || steps.length === 0) {
				container.innerHTML += '<div class="step-item">Aucune étape disponible</div>';
			} else {
				steps.forEach((step, i) => {
					const div = document.createElement('div');
					div.className = 'step-item';
					const icon = step.Type === 'walk' ? '🚶' : '🚴';
					div.innerHTML = `${i + 1}. ${icon} ${step.Instruction} <em>(${(step.Distance / 1000).toFixed(2)} km)</em>`;
					container.appendChild(div);
				});
			}

			container.style.display = 'block';
		}

		// ✅ NOUVELLE FONCTION UTILISANT LES VRAIES COORDONNÉES GPS
		function drawRouteOnMap(itinerary) {
			// Nettoyer les anciennes couches
			if (routeLayer) {
				map.removeLayer(routeLayer);
			}

			routeLayer = L.layerGroup();

			try {
				console.log('📍 Itinéraire reçu:', itinerary);

				if (!itinerary.Steps || itinerary.Steps.length === 0) {
					console.warn('⚠️ Aucune étape dans l\'itinéraire');
					showStatus('✅ Itinéraire calculé !', 'success');
					return;
				}

				// ✅ EXTRAIRE LES POSITIONS RÉELLES DES ÉTAPES
				const allPositions = [];
				itinerary.Steps.forEach(step => {
					if (step.StartPosition && step.StartPosition.lat && step.StartPosition.lng) {
						allPositions.push([step.StartPosition.lat, step.StartPosition.lng]);
					}
					if (step.EndPosition && step.EndPosition.lat && step.EndPosition.lng) {
						allPositions.push([step.EndPosition.lat, step.EndPosition.lng]);
					}
				});

				if (allPositions.length === 0) {
					console.warn('⚠️ Aucune position GPS trouvée');
					showStatus('✅ Itinéraire calculé !', 'success');
					return;
				}

				console.log(`📍 ${allPositions.length} positions GPS extraites`);

				// 1. Dessiner les lignes de l'itinéraire
				itinerary.Steps.forEach((step, index) => {
					if (!step.StartPosition || !step.EndPosition) return;

					const start = [step.StartPosition.lat, step.StartPosition.lng];
					const end = [step.EndPosition.lat, step.EndPosition.lng];

					// Ignorer les étapes sans mouvement (prendre vélo, déposer vélo)
					if (step.Distance === 0) return;

					// Couleur selon le type
					let color = step.Type === 'walk' ? '#28a745' : '#667eea';
					let weight = step.Type === 'walk' ? 4 : 6;
					let dashArray = step.Type === 'walk' ? '10, 5' : null;

					const polyline = L.polyline([start, end], {
						color: color,
						weight: weight,
						opacity: 0.8,
						dashArray: dashArray
					});

					polyline.bindPopup(`
							<strong>${step.Type === 'walk' ? '🚶 À pied' : '🚴 À vélo'}</strong><br>
							${step.Instruction}<br>
							<em>Distance: ${(step.Distance / 1000).toFixed(2)} km</em>
						`);

					routeLayer.addLayer(polyline);
				});

				// 2. Ajouter des marqueurs aux points clés
				const firstStep = itinerary.Steps[0];
				const lastStep = itinerary.Steps[itinerary.Steps.length - 1];

				// Marqueur de départ
				if (firstStep.StartPosition) {
					const startMarker = L.marker([firstStep.StartPosition.lat, firstStep.StartPosition.lng], {
						icon: L.divIcon({
							className: 'custom-marker',
							html: '<div style="background-color: #dc3545; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 3px solid white; box-shadow: 0 3px 8px rgba(0,0,0,0.4);">📍</div>',
							iconSize: [45, 45],
							iconAnchor: [22.5, 22.5]
						})
					});
					startMarker.bindPopup('<strong>🏁 Départ</strong>');
					routeLayer.addLayer(startMarker);
				}

				// Marqueur d'arrivée
				if (lastStep.EndPosition) {
					const endMarker = L.marker([lastStep.EndPosition.lat, lastStep.EndPosition.lng], {
						icon: L.divIcon({
							className: 'custom-marker',
							html: '<div style="background-color: #28a745; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 3px solid white; box-shadow: 0 3px 8px rgba(0,0,0,0.4);">🎯</div>',
							iconSize: [45, 45],
							iconAnchor: [22.5, 22.5]
						})
					});
					endMarker.bindPopup('<strong>🏁 Arrivée</strong>');
					routeLayer.addLayer(endMarker);
				}

				// 3. Marqueurs pour les stations vélo
				itinerary.Steps.forEach((step, index) => {
					if (step.Instruction.includes('Prendre un vélo') && step.StartPosition) {
						const marker = L.marker([step.StartPosition.lat, step.StartPosition.lng], {
							icon: L.divIcon({
								className: 'custom-marker',
								html: '<div style="background-color: #667eea; color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 3px solid white; box-shadow: 0 3px 8px rgba(0,0,0,0.4);">🚲</div>',
								iconSize: [40, 40],
								iconAnchor: [20, 20]
							})
						});
						marker.bindPopup(`<strong>🚲 Station départ</strong><br>${step.Instruction}`);
						routeLayer.addLayer(marker);
					}

					if (step.Instruction.includes('Déposer le vélo') && step.StartPosition) {
						const marker = L.marker([step.StartPosition.lat, step.StartPosition.lng], {
							icon: L.divIcon({
								className: 'custom-marker',
								html: '<div style="background-color: #ffc107; color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 3px solid white; box-shadow: 0 3px 8px rgba(0,0,0,0.4);">🅿️</div>',
								iconSize: [40, 40],
								iconAnchor: [20, 20]
							})
						});
						marker.bindPopup(`<strong>🅿️ Station arrivée</strong><br>${step.Instruction}`);
						routeLayer.addLayer(marker);
					}
				});

				// 4. Ajouter à la carte et centrer
				routeLayer.addTo(map);

				// Calculer les bounds
				const bounds = L.latLngBounds(allPositions);
				map.fitBounds(bounds, {
					padding: [80, 80],
					animate: true,
					duration: 1
				});

				showStatus('✅ Itinéraire réel affiché sur la carte !', 'success');
			} catch (error) {
				console.error('❌ Erreur affichage carte:', error);
				showStatus('✅ Itinéraire calculé (erreur affichage)', 'info');
			}
		}

		function showStatus(message, type) {
			const statusDiv = document.getElementById('status');
			statusDiv.className = `status ${type}`;
			statusDiv.textContent = message;
		}

		console.log('✅ JavaScript chargé (version avec GPS réels)');
	</script>
</body>
</html>
